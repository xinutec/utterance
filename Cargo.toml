[package]
name = "utterance"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["utterance-analysis", "utterance-mapping", "utterance-realisation"]

[features]
# Turns on ts-rs across the workspace — this crate's wire types *and* the
# voiceprint types in utterance-analysis — so `cargo test --features ts
# export_bindings` emits the frontend TypeScript (see scripts/gen-types.sh).
# Off by default: normal builds carry no ts-rs at all.
ts = ["dep:ts-rs", "utterance-analysis/ts", "utterance-mapping/ts"]

[dependencies]
utterance-analysis = { path = "utterance-analysis" }
# The composition root: this crate is where the three layers are wired together,
# and the only one that may depend on all of them.
utterance-mapping = { path = "utterance-mapping" }
utterance-realisation = { path = "utterance-realisation" }
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Content-addressed recording ids: the same audio must land on the same id.
sha2 = "0.11.0"
anyhow = "1.0.104"
# Used only by `src/bin/beating.rs`, which measures the rendered audio rather
# than the score — the same FFT the analysis layer uses, so there is one
# implementation in the workspace and not two.
rustfft = "6.4.1"
thiserror = "2.0.19"
# Sign-in. All three are used only by `webauth`, which is inert unless the
# Nextcloud credentials are in the environment — see that module.
hmac = "0.13.0"
base64 = "0.23.0"
# `default-tls` is rustls here, so this pulls in no OpenSSL and needs no system
# library at build time — which is what keeps the container image and the nix
# package buildable from source alone.
reqwest = { version = "0.13.4", features = ["json", "form"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"], optional = true }

[dev-dependencies]
# Drives the router in-process for the API tests — no socket, no port to clash on.
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.4"
# Builds real WAV bytes for upload fixtures rather than hand-rolled headers.
hound = "3.5.1"
