[package]
name = "utterance-mapping"
version = "0.1.0"
edition = "2024"

[features]
# See the workspace root: enabled only for TS type generation.
ts = ["dep:ts-rs"]

[dependencies]
# One direction only. Mapping reads what analysis measured; analysis must never
# learn that this crate exists, or the split stops being enforceable.
utterance-analysis = { path = "../utterance-analysis" }
# Scores and tunings serialise so a rendering can be reproduced from the artefact
# that produced it. Those carry no ts-rs: they are not wire types until the API
# serves them, and the generated TypeScript should mirror what the API actually
# returns rather than what this crate happens to hold.
#
# `mapping::Mapping` and `mapping::Material` are the exception, and it is worth
# saying why. They are not projected on the way out — the API serves the variant
# itself, so a hand-written wire copy would be the same three names again, which
# is the duplication this module exists to remove.
serde = { version = "1.0.229", features = ["derive"] }
ts-rs = { version = "12.0.1", features = ["serde-compat"], optional = true }
