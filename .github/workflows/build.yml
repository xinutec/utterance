---
name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/flake.lock"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - run: rustup component add clippy rustfmt
      - name: formatting
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace
      - name: rustdoc resolves every intra-doc link
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
      - run: rm -rf frontend/src/app/generated
      - run: cargo test --workspace --features ts export_bindings
      - name: generated types are current
        run: |
          if [ -n "$(git status --porcelain -- frontend/src/app/generated)" ]; then
            echo "generated types drifted; run scripts/gen-types.sh and commit" >&2
            git status --porcelain -- frontend/src/app/generated >&2
            git diff -- frontend/src/app/generated >&2
            exit 1
          fi

  fe-verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: frontend deps match the lockfile
        run: pnpm install --frozen-lockfile
      - name: frontend lint
        run: pnpm run lint
      - name: frontend typecheck (e2e)
        run: pnpm run typecheck:e2e
      - name: frontend unit tests
        run: pnpm test
      - name: frontend build
        run: pnpm exec ng build
      - run: pnpm exec playwright install --with-deps chromium
      - name: frontend ui-check (phone-width layout harness)
        run: pnpm run ui-check

  image:
    needs: [verify, fe-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: xinutec/utterance:latest
          cache-from: type=registry,ref=xinutec/utterance:cache
          cache-to: type=registry,ref=xinutec/utterance:cache,mode=max
