<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>music</title>
    <base href="/" />
    <!--
      interactive-widget=resizes-content: without it Chrome pans the layout when
      the on-screen keyboard opens, sliding fixed chrome off the top. Resizing
      the content instead keeps the toolbar and the controls where they are.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
