<div class="chart">
  <div class="zoom">
    <button matIconButton type="button" aria-label="Show less time" (click)="zoomIn()">
      <mat-icon>zoom_in</mat-icon>
    </button>
    <button matIconButton type="button" aria-label="Show more time" (click)="zoomOut()">
      <mat-icon>zoom_out</mat-icon>
    </button>
    <span class="scale">{{ pixelsPerSecond }} px/s</span>
  </div>

  <!--
    The canvas stays the width of the screen and draws only the window in view;
    the `.extent` beside it is what gives the scrollbar something to travel. A
    canvas as wide as the take would be 18,000px for a minute of speech at the
    useful magnification — past what a browser will allocate, and past the edge
    of the page, which is a layout fault whatever the scroller does.
  -->
  <div #scroller class="scroller" (scroll)="onScroll()">
    <canvas
      #canvas
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp($event)"
    ></canvas>
    <div class="extent" [style.width.px]="width"></div>
  </div>
</div>
