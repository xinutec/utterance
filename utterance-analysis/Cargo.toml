[package]
name = "utterance-analysis"
version = "0.1.0"
edition = "2024"

[features]
# See the workspace root: enabled only for TS type generation.
ts = ["dep:ts-rs"]

[dependencies]
# WAV container only. Everything past decoding is arithmetic in this crate.
hound = "3.5.1"
# STFT for spectral flux. Pure Rust, no FFTW/system library to link.
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
ts-rs = { version = "12.0.1", features = ["serde-compat"], optional = true }

[dev-dependencies]
serde_json = "1.0.151"

[lints]
workspace = true

# A designated pure core (docs/architecture.md), so DL-RUST-UNBOUNDED-LOOP holds
# it to `for` over a bounded thing. Next to `[lints]` because it is the same
# subject — this crate's static-analysis policy — and it travels with the crate
# rather than sitting in a root-level list a rename could detach it from.
[package.metadata.dev-lint]
totality = true
